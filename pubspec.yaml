name: valoqui
description: "AI Spanish conversation tutor"
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: "^3.8.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──────────────────────────────────────
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  google_sign_in: ^7.2.0

  # ── State Management ──────────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # ── Freezed ───────────────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # ── Dependency Injection ──────────────────────────
  get_it: ^9.1.1

  # ── Navigation ───────────────────────────────────
  go_router: ^17.1.0

  # ── HTTP / API ────────────────────────────────────
  dio: ^5.7.0

  # ── Functional Programming ────────────────────────
  fpdart: ^1.2.0

  # ── Secure Storage ───────────────────────────────
  flutter_secure_storage: ^10.0.0

  # ── Connectivity ─────────────────────────────────
  connectivity_plus: ^7.0.0

  # ── Stream Utilities ─────────────────────────────
  stream_transform: ^2.1.1

  # ── Animations ───────────────────────────────────
  flutter_animate: ^4.5.2

  # ── Utilities ────────────────────────────────────
  url_launcher: ^6.3.0
  intl: ^0.20.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces/Fraunces-Bold.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans/DMSans-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
          weight: 400

  assets:
    - assets/fonts/
    - assets/images/
