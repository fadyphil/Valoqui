# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Async safety
    unawaited_futures: error
    avoid_void_async: error

    # Resource management
    cancel_subscriptions: error
    close_sinks: error

    # Type safety
    avoid_dynamic_calls: error
    # omit_local_variable_types: ignore

    # UI safety
    use_build_context_synchronously: error

    # Dead code
    unused_element: error
    unused_field: error
    unused_import: error
    unused_local_variable: error

  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # --- Async ---
    avoid_void_async: true
    unawaited_futures: true

    # --- Error handling ---
    avoid_catches_without_on_clauses: true # NEW: bare catch{} hides bug types
    avoid_catching_errors: true # NEW: never catch Error, only Exception

    # --- BLoC / Architecture ---
    prefer_final_fields: true
    prefer_final_locals: true
    avoid_positional_boolean_parameters: true # NEW: speak(true, false) → unreadable

    # --- Type safety ---
    avoid_dynamic_calls: true
    always_use_package_imports: true # forces absolute imports, catches wrong-layer imports visually
    avoid_relative_lib_imports: true
    always_declare_return_types: true # NEW: no implicit dynamic returns
    tighten_type_of_initializing_formals: true # NEW: tightens param types from supertype

    # --- Resource safety ---
    cancel_subscriptions: true
    close_sinks: true

    # --- Null safety ---
    avoid_init_to_null: true # NEW: int x = null → int? x
    unnecessary_null_checks: true # NEW: removes redundant ! operators
    unnecessary_null_aware_assignments: true # NEW: x ??= y where x can't be null

    # --- Code correctness ---
    avoid_bool_literals_in_conditional_expressions: true # NEW: x ? true : false → just x
    avoid_empty_else: true
    literal_only_boolean_expressions: true
    no_duplicate_case_values: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    missing_whitespace_between_adjacent_strings: true # NEW: "hello""world" silent bug
    no_adjacent_strings_in_list: true # NEW: ["a" "b", "c"] → probably a bug

    # --- Performance ---
    avoid_slow_async_io: true
    use_string_buffers: true
    noop_primitive_operations: true # NEW: "hello".toString() → redundant

    # --- Flutter specific ---
    use_build_context_synchronously: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_colored_box: true
    use_decorated_box: true
    sort_child_properties_last: true # NEW: child: always last in widget params

    # --- Modern Dart ---
    use_super_parameters: true
    prefer_const_constructors: true # NEW: rebuild optimization
    prefer_const_declarations: true # NEW: const where possible
    prefer_const_constructors_in_immutables: true # NEW: for your Freezed classes
    unnecessary_await_in_return: true # NEW: return await x → return x (unless in try/catch)
    unnecessary_lambdas: true # NEW: () => foo() → just foo
    prefer_is_empty: true # NEW: .length == 0 → .isEmpty
    prefer_is_not_empty: true
    prefer_if_null_operators: true # NEW: x != null ? x : y → x ?? y
    prefer_null_aware_operators: true # NEW: x == null ? null : x.y → x?.y
    prefer_spread_collections: true # NEW: addAll([...]) → spread operator

    # --- Style ---
    avoid_print: true
    directives_ordering: true # NEW: enforces import order
    eol_at_end_of_file: true
    avoid_multiple_declarations_per_line: true
  # avoid_print: false  # Uncomment to disable the `avoid_print` rule
  # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
